name: Publish deployment template release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile release template
        uses: azure/cli@v2
        with:
          inlineScript: |
            az bicep build --file main.bicep --outfile /tmp/azuredeploy.json
            python3 - <<'PY'
            import json
            with open('/tmp/azuredeploy.json', encoding='utf-8-sig') as generated:
                expected = json.load(generated)
            with open('azuredeploy.json', encoding='utf-8-sig') as committed:
                actual = json.load(committed)
            if actual != expected:
                raise SystemExit('azuredeploy.json does not match main.bicep.')
            PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          azuredeploy.json
          --title "Dronefleet ${GITHUB_REF_NAME}"
          --generate-notes