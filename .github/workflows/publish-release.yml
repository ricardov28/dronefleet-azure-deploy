name: Publish deployment template release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile release template
        uses: azure/cli@v2
        with:
          inlineScript: |
            az bicep build --file main.bicep --outfile /tmp/azuredeploy.json
            cmp /tmp/azuredeploy.json azuredeploy.json || {
              echo 'azuredeploy.json does not match main.bicep.'
              exit 1
            }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          azuredeploy.json
          --title "Dronefleet ${GITHUB_REF_NAME}"
          --generate-notes